name: Run OSINT Domain Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y whois

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install dnspython requests tldextract python-whois ddgs

    - name: Run Scraper Script
      env:
        SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      run: |
        python web_domain_checker_extended.py

    - name: Commit and push results
      run: |
        shopt -s nullglob
        files=(results_*.csv)

        if ((${#files[@]} == 0)); then
          echo "No results_*.csv files found."
          exit 1
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- "${files[@]}"

        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi

        git commit -m "Update domain scraping results"
        git push origin "HEAD:${GITHUB_REF_NAME}"
